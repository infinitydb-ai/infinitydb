[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infinitydb-ai"
version = "1.4.2"
description = "InfinityDB - High-performance open-source agent memory engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "InfinityDB AI", email = "team@infinitydb.ai"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/infinitydb-ai/infinitydb"
Repository = "https://github.com/infinitydb-ai/infinitydb"
Issues = "https://github.com/infinitydb-ai/infinitydb/issues"

[project.scripts]
infinitydb-mcp = "infinitydb.mcp_server:run_server"
infinitydb-demo = "infinitydb.demo:main"
infinitydb-audit = "infinitydb.audit:main"
infinitydb-migrate = "infinitydb.migrate:main"
infinitydb-evidence = "infinitydb.evidence:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Opt-in local semantic recall. The default install stays dependency-free; this
# extra pulls ONNX Runtime through fastembed for a local embedder and
# cross-encoder (no API key, no network call after the model download).
onnx = ["fastembed>=0.6", "onnx>=1.16"]
# Opt-in PostgreSQL backend for infinitydb.storage. The database itself needs the
# pgvector extension (CREATE EXTENSION vector); the Python package is not needed.
postgres = ["psycopg[binary,pool]>=3.1"]

[tool.hatch.build.targets.wheel]
packages = ["infinitydb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:playwright -p no:langsmith"


