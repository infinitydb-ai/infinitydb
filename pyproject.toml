[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infinitydb"
version = "1.0.0"
description = "InfinityDB - High-performance open-source agent memory engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "InfinityDB AI", email = "team@infinitydb.ai"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/infinitydb-ai/infinitydb"
Repository = "https://github.com/infinitydb-ai/infinitydb"
Issues = "https://github.com/infinitydb-ai/infinitydb/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["infinitydb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:playwright -p no:langsmith"
