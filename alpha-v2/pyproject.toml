[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinitydb-next"
version = "2.0.0a1"
description = "Local-first, evidence-grounded adaptive memory reference engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
ann = ["hnswlib>=0.8.0"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
infinitydb-bench = "infinitydb_next.benchmark:main"
infinitydb-ann-bench = "infinitydb_next.ann_benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
