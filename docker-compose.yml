version: "3.8"

services:
  infinitydb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infinitydb-cloud
    ports:
      - "8080:8080"
    environment:
      - INFINITYDB_PATH=/data/infinity.db
      - PORT=8080
    volumes:
      - infinity_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/stats')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  infinity_data:
    driver: local
