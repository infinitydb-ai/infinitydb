<svg xmlns="http://www.w3.org/2000/svg" width="916" height="608" viewBox="0 0 916 608" role="img" aria-labelledby="t d">
  <title id="t">InfinityDB demo: ingest three turns and recall facts, in memory, with no model calls</title>
  <desc id="d">InfinityDB demo — in-memory, no model calls, no network
  open       3.0 ms
  ingest     4.2 ms  (3 turns)

query: &#x27;where does the user live&#x27;
  [1.056] I moved to Lisbon in March 2024 and I work as a data engineer at a ceramics studio
  1 memory in 0.8 ms

query: &#x27;what do they do for work&#x27;
  [0.869] I work as a data engineer at a ceramics studio
  [0.833] I moved to Lisbon in March 2024 and I work as a data engineer at a ceramics studio
  2 memories in 0.6 ms

query: &#x27;what is the budget&#x27;
  [1.345] My budget for the new cluster is forty thousand euros
  1 memory in 0.2 ms

  stored  facts=4 proofs=4 backend=SQLite-WAL
  recall  1.6 ms over 3 questions

Next: give this to an agent over MCP —
  claude mcp add infinitydb -- uvx --from infinitydb-ai infinitydb-mcp</desc>
