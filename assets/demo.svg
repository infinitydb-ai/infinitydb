    .cursor { opacity: 0; animation: blink 1.05s steps(1) infinite; }
    @keyframes reveal {
      0% { opacity: 0; }
      2% { opacity: 1; }
      93% { opacity: 1; }
      97%, 100% { opacity: 0; }
    }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ln { animation: none; opacity: 1; }
      .cursor { animation: none; opacity: 1; }
    }
  </style>
